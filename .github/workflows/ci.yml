name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # O client tipado (kubb) é gerado a partir do contrato zod→OpenAPI e NÃO é
      # versionado — precisa ser gerado antes do typecheck do web.
      - name: Generate API contract
        run: pnpm api:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Design tokens
        run: pnpm --filter web tokens:check

      # Build de produção (AOT) — pega quebra de template do web antes do deploy.
      - name: Build web
        run: pnpm --filter web build
